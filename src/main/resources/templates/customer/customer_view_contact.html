<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{customer/base :: layout(~{::section})}">

<body>

	<section class="customer-dashboard">

		<div class="container py-4">

			<h2 class="text-center text-white mb-4">My Contacts</h2>

			<div class="table-responsive">

				<table
					class="table table-hover align-middle text-center contact-table">

					<thead>
						<tr>
							<th>CID</th>
							<th>Image</th>
							<th>Name</th>
							<th>Nick Name</th>
							<th>Phone Number</th>
							<th>Description</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="contact : ${contacts}">

							<td th:text="${contact.cid}"></td>

							<td><img
								th:src="@{/uploads/{image}(image=${contact.image})}"
								alt="Contact" class="contact-image"></td>

							<td th:text="${contact.name}"></td>

							<td th:text="${contact.nickName}"></td>

							<td th:text="${contact.phoneNumber}"></td>

							<td th:text="${contact.description}"></td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</section>

</body>
</html>
