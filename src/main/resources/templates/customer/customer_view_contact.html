<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{customer/base :: layout(~{::section})}">

<body>

	<section class="customer-dashboard contact-page">

		<div class="container contact-container">

			<div class="contact-glass-card">

				<div th:if="${message}" th:classappend="${message.type}"
					class="alert"
					style="width: 90%; margin: 0 auto 16px auto; padding: 14px 20px; border-radius: 6px; text-align: center; font-size: 15px; font-weight: 500; box-sizing: border-box;">

					<p th:text="${message.content}" style="margin: 0; padding: 0;">
					</p>

				</div>


				<!-- Header -->
				<div class="contact-header">

					<div class="contact-title-wrapper">

						<div class="contact-icon">
							<i class="bi bi-people-fill"></i>
						</div>

						<div class="contact-heading">

							<h2>My Contacts</h2>

							<p>Manage and organize your important contacts</p>

						</div>

					</div>

					<div class="contact-sparkle">
						<i class="bi bi-stars"></i>
					</div>

				</div>


				<!-- Table -->
				<div class="contact-table-wrapper">

					<div class="table-responsive">

						<table class="table contact-table">

							<thead>
								<tr>

									<th><i class="bi bi-hash"></i> ID</th>

									<th><i class="bi bi-person"></i> Name</th>

									<th><i class="bi bi-envelope"></i> Email</th>

									<th><i class="bi bi-telephone"></i> Phone</th>

									<th><i class="bi bi-gear"></i> Action</th>

								</tr>
							</thead>


							<tbody>

								<tr th:each="c : ${contacts}">

									<td class="contact-id" th:text="${c.cid}"></td>

									<td><img th:if="${c.image.startsWith('img/')}"
										th:src="@{'/' + ${c.image}}" alt=""
										style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">

										<img th:unless="${c.image.startsWith('img/')}"
										th:src="@{'/uploads/' + ${c.image}}" alt=""
										style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">

										<span th:text="${c.name}"></span></td>

									<td><a href=""
										th:href="@{'/customer/' + ${c.cid} + '/viewContact'}"> <span
											th:text="${c.email}"></span>

									</a></td>

									<td th:text="${c.phoneNumber}"></td>

									<td>

										<div class="contact-actions">

											<a th:href="@{/customer/delete/{id}(id=${c.cid})}"
												class="btn contact-delete-btn"> <i class="bi bi-trash3"></i>
												Delete
											</a>

											<button type="button" class="btn contact-update-btn">

												<i class="bi bi-pencil-square"></i> Update

											</button>

										</div>

									</td>

								</tr>

							</tbody>

						</table>

						<br />

						<!-- Pagination Layout -->
						<nav aria-label="Page navigation example" th:if="${totalPage > 0}">
							<ul class="pagination">
								<li th:if="${currentPage != 0}" class="page-item"><a
									class="page-link"
									th:href="@{'/customer/viewContact/' + ${currentPage-1}}"
									href="#">Previous</a></li>
								<li th:classappend="${currentPage == i-1 ? 'active':''}"
									th:each="i: ${#numbers.sequence(1,totalPage)}"
									class="page-item"><a class="page-link"
									th:href="@{'/customer/viewContact/' + ${i-1}}" href="#"><span
										th:text="${i}"></span></a></li>
								<li th:if="${currentPage+1 != totalPage}" class="page-item"><a
									class="page-link"
									th:href="@{'/customer/viewContact/' + ${currentPage+1}}"
									href="#">Next</a></li>
							</ul>
						</nav>

					</div>

				</div>


				<!-- Bottom decoration -->
				<div class="contact-decoration">

					<span></span> <span></span> <i class="bi bi-circle-fill"></i> <span></span>
					<span></span>

				</div>

			</div>
		</div>

	</section>

</body>
</html>
